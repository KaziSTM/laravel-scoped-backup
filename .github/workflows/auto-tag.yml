name: Auto Tag

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  tag:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: 🔍 Determine next version
        id: semver
        run: |
          git fetch --tags
          python3 - << 'EOF' "$GITHUB_OUTPUT"
          import sys, re, subprocess

          output_file = sys.argv[1]

          # Check if current commit is already tagged
          tags_at_head = subprocess.run(
              ["git", "tag", "--points-at", "HEAD"],
              capture_output=True, text=True, check=True
          ).stdout.strip().split()

          if tags_at_head:
              print(f"Commit is already tagged ({tags_at_head[0]}); skipping release.")
              with open(output_file, "a") as f:
                  f.write("released=false\n")
              sys.exit(0)

          # Extract commit subject and body
          subject = subprocess.run(
              ["git", "log", "-1", "--pretty=format:%s"],
              capture_output=True, text=True, check=True
          ).stdout.strip()

          body = subprocess.run(
              ["git", "log", "-1", "--pretty=format:%b"],
              capture_output=True, text=True, check=True
          ).stdout

          # Handle merge commits
          if subject.startswith("Merge pull request"):
              subject = subprocess.run(
                  ["git", "log", "-1", "--no-merges", "--pretty=format:%s"],
                  capture_output=True, text=True, check=True
              ).stdout.strip()

          # Conventional commit evaluation
          is_breaking = False
          if re.search(r"^[a-zA-Z]+(\([^)]+\))?!:", subject):
              is_breaking = True
          elif re.search(r"^(BREAKING CHANGE|BREAKING-CHANGE):", body, re.MULTILINE):
              is_breaking = True

          bump = None
          if is_breaking:
              bump = "major"
          elif re.search(r"^feat(\([^)]+\))?:", subject):
              bump = "minor"
          elif re.search(r"^fix(\([^)]+\))?:", subject):
              bump = "patch"

          if not bump:
              print(f"Commit '{subject}' does not trigger a release (not feat, fix, or breaking).")
              with open(output_file, "a") as f:
                  f.write("released=false\n")
              sys.exit(0)

          # Retrieve latest semver tag
          tag_proc = subprocess.run(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True
          )
          tags = [t.strip() for t in tag_proc.stdout.splitlines() if t.strip()]

          if tags:
              latest = tags[0].lstrip("v")
              parts = latest.split(".")
              major = int(parts[0]) if len(parts) > 0 else 0
              minor = int(parts[1]) if len(parts) > 1 else 0
              patch = int(parts[2]) if len(parts) > 2 else 0
          else:
              major, minor, patch = 0, 0, 0

          if bump == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump == "minor":
              minor += 1
              patch = 0
          elif bump == "patch":
              patch += 1

          next_version = f"v{major}.{minor}.{patch}"
          print(f"Determined next version: {next_version} (bump: {bump})")

          with open(output_file, "a") as f:
              f.write(f"version={next_version}\n")
              f.write("released=true\n")
          EOF

      - name: 🏷️ Create version tag
        if: steps.semver.outputs.released == 'true'
        env:
          TAG_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          git tag "$TAG_VERSION"
          git push origin "$TAG_VERSION"

      - name: 📝 Generate changelog
        id: changelog
        if: steps.semver.outputs.released == 'true'
        env:
          CURRENT: ${{ steps.semver.outputs.version }}
        run: |
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$CURRENT" | head -n1 || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          LOG=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%an)")
          [ -z "$LOG" ] && LOG="- No user-facing changes"

          EOF_DELIM=$(openssl rand -hex 16)
          echo "previous=${PREVIOUS:-N/A}" >> "$GITHUB_OUTPUT"
          echo "summary<<$EOF_DELIM" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF_DELIM" >> "$GITHUB_OUTPUT"

      - name: 📣 Notify Discord (version tagged)
        if: steps.semver.outputs.released == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          VERSION: ${{ steps.semver.outputs.version }}
          PREVIOUS: ${{ steps.changelog.outputs.previous }}
          ACTOR: ${{ github.actor }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGELOG: ${{ steps.changelog.outputs.summary }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg version "$VERSION" \
            --arg previous "$PREVIOUS" \
            --arg actor "$ACTOR" \
            --arg url "$WORKFLOW_URL" \
            --arg changelog "$CHANGELOG" \
            '{
              content: ("🚀 **PRODUCTION — Laravel Scoped Backup**\n\n📦 **Repository:** `" + $repo + "`\n🌿 **Branch:** `" + $branch + "`\n🏷️ **Current Tag:** **" + $version + "**\n⬅️ **Previous Tag:** `" + $previous + "`\n👤 **Triggered by:** `" + $actor + "`\n\n📝 **Changes since last release**\n" + $changelog + "\n\n🔗 **Workflow:** " + $url)
            }')

          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
