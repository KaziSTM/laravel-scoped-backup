name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lerd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lerd
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: lerd
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'
        exclude:
          - php: '8.5'
            laravel: '11.*'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, pdo_pgsql, pgsql, pdo_mysql, mysql
          tools: composer:v2
          coverage: none

      - name: 🛠️ Install database client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          which mysqldump >/dev/null 2>&1 || sudo apt-get install -y mysql-client
          sudo ln -sf "$(which mysqldump)" /usr/local/bin/mariadb-dump
          sudo ln -sf "$(which mysql)" /usr/local/bin/mariadb

      - name: 📦 Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: ♻️ Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: 📦 Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --prefer-stable

      - name: 🔍 Validate composer.json
        run: composer validate --strict

      - name: 🧪 Execute test suite
        env:
          DB_PGSQL_HOST: 127.0.0.1
          DB_PGSQL_PORT: 5432
          DB_PGSQL_USERNAME: postgres
          DB_PGSQL_PASSWORD: password
          DB_MYSQL_HOST: 127.0.0.1
          DB_MYSQL_PORT: 3306
          DB_MYSQL_USERNAME: root
          DB_MYSQL_PASSWORD: password
          DB_MARIADB_HOST: 127.0.0.1
          DB_MARIADB_PORT: 3307
          DB_MARIADB_USERNAME: root
          DB_MARIADB_PASSWORD: password
        run: vendor/bin/phpunit --colors=always