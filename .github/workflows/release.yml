name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Resolve version tag
        id: tag
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: 📝 Generate changelog
        id: changelog
        env:
          CURRENT: ${{ steps.tag.outputs.tag }}
        run: |
          git fetch --tags
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$CURRENT" | head -n1 || true)
          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$CURRENT"
          else
            RANGE="$CURRENT"
          fi

          LOG=$(git log "$RANGE" --no-merges --pretty=format:"- %s (%an)")
          [ -z "$LOG" ] && LOG="- Release $CURRENT"

          EOF_DELIM=$(openssl rand -hex 16)
          echo "previous=${PREVIOUS:-N/A}" >> "$GITHUB_OUTPUT"
          echo "summary<<$EOF_DELIM" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "$EOF_DELIM" >> "$GITHUB_OUTPUT"

      - name: 📦 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.version }}
          body: |
            ## 🚀 Release ${{ steps.tag.outputs.version }}

            ### Changes since last release
            ${{ steps.changelog.outputs.summary }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📣 Notify Discord (release)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
          PREVIOUS: ${{ steps.changelog.outputs.previous }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.summary }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping notification."
            exit 0
          fi

          PAYLOAD=$(jq -n \
            --arg repo "$REPO" \
            --arg version "$VERSION" \
            --arg previous "$PREVIOUS" \
            --arg url "$RELEASE_URL" \
            --arg changelog "$CHANGELOG" \
            '{
              content: ("🚀 **Release " + $version + " published**\n\n📦 **Repository:** `" + $repo + "`\n⬅️ **Previous:** `" + $previous + "`\n\n📝 **Changes**\n" + $changelog + "\n\n🔗 " + $url)
            }')

          curl -fsS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
