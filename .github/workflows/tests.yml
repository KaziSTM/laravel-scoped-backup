name: Tests & Compatibility Matrix

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lerd
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 2s --health-retries 5

      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: lerd
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: lerd
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3307:3306
        options: --health-cmd="healthcheck.sh --connect" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*']
        dependency-version: [prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '9.*'
          - laravel: '12.*'
            testbench: '10.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite3, pdo_sqlite, pdo_pgsql, pgsql, pdo_mysql, mysql
          tools: composer:v2
          coverage: none

      - name: Install database client utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client mysql-client mariadb-client

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Execute tests
        env:
          DB_PGSQL_HOST: 127.0.0.1
          DB_PGSQL_PORT: 5432
          DB_PGSQL_USERNAME: postgres
          DB_PGSQL_PASSWORD: password
          DB_MYSQL_HOST: 127.0.0.1
          DB_MYSQL_PORT: 3306
          DB_MYSQL_USERNAME: root
          DB_MYSQL_PASSWORD: password
          DB_MARIADB_HOST: 127.0.0.1
          DB_MARIADB_PORT: 3307
          DB_MARIADB_USERNAME: root
          DB_MARIADB_PASSWORD: password
        run: vendor/bin/phpunit --colors=always
